services:
  - type: web
    name: agroai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: GEOCODING_BASE_URL
        value: https://geocoding-api.open-meteo.com/v1
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
